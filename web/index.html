<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>月喰みの漂流島 Web Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Co-op survival hidden-role prototype</p>
          <h1>月喰みの漂流島</h1>
        </div>
        <div class="round-box">
          <span>Turn</span>
          <strong id="roundLabel">1</strong>
        </div>
      </header>

      <section class="setup" id="setupPanel">
        <div class="section-title">
          <h2>漂流者を登録</h2>
          <p>全員が同じ海岸から始め、島を探索して脱出を目指します。1人だけ月喰みが紛れています。</p>
        </div>
        <div class="setup-grid">
          <label>人数
            <select id="playerCount">
              <option value="4">4人</option>
              <option value="5">5人</option>
            </select>
          </label>
          <label>乱数シード
            <input id="seedInput" type="text" value="island-1" />
          </label>
          <label class="check-row">
            <input id="soloMode" type="checkbox" checked />
            ソロテスト: P1以外を自動操作
          </label>
        </div>
        <div class="names" id="nameFields"></div>
        <button class="primary" id="startGame">漂着する</button>
      </section>

      <section class="board hidden" id="gamePanel">
        <section class="phase" id="phasePanel"></section>
        <aside class="players" id="playersPanel"></aside>
      </section>
    </main>

    <dialog id="identityDialog">
      <div class="dialog-card">
        <p class="eyebrow" id="identityOwner"></p>
        <h2 id="identityTitle"></h2>
        <p id="identityText"></p>
        <button class="primary" id="closeIdentity">閉じる</button>
      </div>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
