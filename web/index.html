<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Catan Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">classic resource settlement prototype</p>
          <h1>Simple Catan</h1>
        </div>
        <div class="round-box">
          <span>Turn</span>
          <strong id="roundLabel">1</strong>
        </div>
      </header>

      <section class="setup" id="setupPanel">
        <div class="section-title">
          <h2>プレイヤー登録</h2>
          <p>19枚の地形タイルで資源を集め、道・開拓地・街を建てて10点を目指す簡易カタンです。</p>
        </div>
        <div class="setup-grid">
          <label>人数
            <select id="playerCount">
              <option value="3">3人</option>
              <option value="4">4人</option>
            </select>
          </label>
          <label>乱数シード
            <input id="seedInput" type="text" value="catan-1" />
          </label>
        </div>
        <div class="names" id="nameFields"></div>
        <button class="primary" id="startGame">ゲーム開始</button>
      </section>

      <section class="board hidden" id="gamePanel">
        <section class="phase" id="phasePanel"></section>
        <aside class="players" id="playersPanel"></aside>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
